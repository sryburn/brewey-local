# Reviewed against official provider docs and OpenRouter Models API on 2026-10-01.
# Stable text models with tool support; capabilities gate requests on the server.
# Reasoning levels are intentionally limited to useful user choices.
version: 2
reviewedAt: 2026-10-01
providers:
  - id: openai
    label: OpenAI
    enabledWhenEnv: OPENAI_API_KEY
    models:
      - id: gpt-6.1-sol
        label: GPT-6.1 Sol
        slug: openai/gpt-6.1-sol
        description: Balanced speed and capability for everyday brewing advice.
        capabilities:
          reasoningEffort: true
          reasoningEffortLevels:
            - low
            - medium
            - high
          verbosity: true
          maxTokens: true
          maxOutputTokens: 128000
          temperature: false
          reasoningSummary: true
          requiresResponses: true
        ui:
          defaults: {}
      - id: gpt-6-luna
        label: GPT-6 Luna
